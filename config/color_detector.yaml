# Color-blob detector tuning (HSV). Default: a red box.
# Swap these ranges to detect a different colored object.

color_detector:
  color_image_topic: "/camera/color/image_raw"
  depth_points_topic: "/camera/depth/points"
  camera_frame: "camera_depth_optical_frame"
  base_frame: "base_link"
  publish_topic: "/detected_object_pose"

  # HSV thresholds (OpenCV ranges: H 0-179, S 0-255, V 0-255)
  # Red wraps around 0/179, so two ranges are provided.
  hsv_lower_1: [0, 120, 70]
  hsv_upper_1: [10, 255, 255]
  hsv_lower_2: [170, 120, 70]
  hsv_upper_2: [179, 255, 255]

  min_blob_area: 150   # pixels; ignore smaller blobs as noise
